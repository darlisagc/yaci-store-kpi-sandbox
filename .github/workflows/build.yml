name: Clean, Build

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - develop/*
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - develop/*

# Least privilege by default (OpenSSF Scorecard: Token-Permissions)
permissions:
  contents: read

jobs:
  commit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'liberica'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -PskipSigning=true --stacktrace
