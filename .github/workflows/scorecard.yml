# OpenSSF Scorecard (KPI G3-KR2)
# Runs the 18 Scorecard checks, uploads findings to the Security tab and
# publishes the result to https://api.scorecard.dev (needed for the badge and
# for the monthly KPI report). The repository must be public for publishing.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'   # every Monday 06:30 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to api.scorecard.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # For a full Branch-Protection score, add a fine-grained admin read token:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
