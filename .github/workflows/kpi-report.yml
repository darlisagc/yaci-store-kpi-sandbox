# Monthly KPI evidence report (Goals 2027: G2-KR2, G3-KR1, G3-KR2)
# Read-only checks via the GitHub API and api.scorecard.dev; the report appears
# in the run's Summary tab and as a downloadable artifact for the monthly report.
name: KPI report

on:
  schedule:
    - cron: '0 7 1 * *'   # 1st of every month, 07:00 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated owner/repo list'
        default: 'bloxbean/yaci-store bloxbean/cardano-client-lib bloxbean/yaci-devkit bloxbean/yaci bloxbean/yano bloxbean/yano-x bloxbean/julc bloxbean/zeroj'
      since:
        description: 'Release window start (YYYY-MM-DD)'
        default: '2027-01-01'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run KPI checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOS: ${{ inputs.repos || 'bloxbean/yaci-store bloxbean/cardano-client-lib bloxbean/yaci-devkit bloxbean/yaci bloxbean/yano bloxbean/yano-x bloxbean/julc bloxbean/zeroj' }}
          SINCE: ${{ inputs.since || '2027-01-01' }}
        run: python3 scripts/kpi/kpi_check.py $REPOS --since "$SINCE" --json kpi-report.json > kpi-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpi-report
          path: kpi-report.*
