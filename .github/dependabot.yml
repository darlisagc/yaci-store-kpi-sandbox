# Automated dependency updates (OpenSSF Scorecard: Dependency-Update-Tool)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: [ "org.springframework*" ]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /components/admin-ui/frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
